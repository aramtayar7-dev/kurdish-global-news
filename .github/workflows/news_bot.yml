name: Kurdish Global News Bot

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

concurrency:
  group: news-bot-run
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'kurdish_global_news_bot/requirements.txt'

      - name: Restore or Cache SQLite Database
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: kurdish_global_news_bot/data
          key: bot-db-${{ github.run_id }}
          restore-keys: |
            bot-db-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kurdish_global_news_bot/requirements.txt

      - name: Install RTL Text Libraries for Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 libharfbuzz0b libraqm0

      - name: Ensure FFmpeg is Available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Prefer IPv4 for Telegram API
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Run News Bot Cycle
        working-directory: kurdish_global_news_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENABLE_LOCAL_LLM: 'false'
          AUTO_PUBLISH: 'true'
          MAX_ARTICLE_AGE_MINUTES: '60'
        run: |
          python main.py --once
