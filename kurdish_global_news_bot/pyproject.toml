[project]
name = "kurdish-global-news-bot"
version = "1.0.0"
description = "Kurdish Global News Bot instant admin Telegram webhook and news card generator"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[httpx]>=21.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "rapidfuzz>=3.0.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "certifi>=2024.0.0"
]

[tool.vercel]
entrypoint = "api.webhook:handler"
